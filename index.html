<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Stock Tracker</title>

  <style>
    :root {
      --bg: #0b1020;
      --panel: #121a2f;
      --line: #27324a;
      --text: #e8eefc;
      --muted: #8f9bb3;
      --green: #22c55e;
      --red: #ef4444;
      --blue: #2563eb;
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .wrap {
      max-width: 1200px;
      margin: auto;
      padding: 24px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px;
      background: #10182d;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
    }

    .btn {
      border: none;
      padding: 12px 16px;
      border-radius: 12px;
      cursor: pointer;
      color: white;
      font-weight: bold;
    }

    .btn-primary {
      background: var(--blue);
    }

    .btn-danger {
      background: var(--red);
    }

    .hidden {
      display: none;
    }

    .auth-box,
    .panel {
      background: #10182d;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      margin-bottom: 16px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #0b1020;
      color: white;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 14px;
      border-bottom: 1px solid var(--line);
      text-align: left;
    }

    .positive {
      color: var(--green);
      font-weight: bold;
    }

    .negative {
      color: var(--red);
      font-weight: bold;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4,1fr);
      gap: 16px;
      margin-bottom: 20px;
    }

    .card {
      background: #10182d;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 20px;
    }

    .card strong {
      font-size: 28px;
      display: block;
      margin-top: 10px;
    }

    @media(max-width: 900px) {
      .cards {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media(max-width: 600px) {
      .cards {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="wrap">

  <div class="topbar">
    <div>
      <h1>Stock Tracker</h1>
      <p>Portefeuille connecté avec Supabase</p>
    </div>

    <button id="logoutBtn" class="btn btn-danger hidden">
      Déconnexion
    </button>
  </div>

  <div id="authBox" class="auth-box">

    <h2>Connexion</h2>

    <input
      type="email"
      id="email"
      placeholder="email@gmail.com"
    >

    <input
      type="password"
      id="password"
      placeholder="mot de passe"
    >

    <button id="signupBtn" class="btn btn-primary">
      Créer un compte
    </button>

    <button
      id="loginBtn"
      class="btn"
      style="background:#334155;margin-left:10px;"
    >
      Connexion
    </button>

    <p id="status"></p>

  </div>

  <div id="app" class="hidden">

    <div class="cards">

      <div class="card">
        Valeur totale
        <strong id="totalValue">0 €</strong>
      </div>

      <div class="card">
        Gain / Perte
        <strong id="totalGain">0 €</strong>
      </div>

      <div class="card">
        Performance
        <strong id="totalPerf">0%</strong>
      </div>

      <div class="card">
        Positions
        <strong id="stockCount">0</strong>
      </div>

    </div>

    <div class="panel">

      <h2>Ajouter une action</h2>

      <input type="text" id="symbol" placeholder="AAPL">
      <input type="text" id="name" placeholder="Apple">
      <input type="number" id="quantity" placeholder="Quantité">
      <input type="number" id="buyPrice" placeholder="Prix achat">
      <input type="number" id="currentPrice" placeholder="Prix actuel">

      <button id="addBtn" class="btn btn-primary">
        Ajouter
      </button>

    </div>

    <div class="panel">

      <h2>Mon portefeuille</h2>

      <table>
        <thead>
          <tr>
            <th>Symbole</th>
            <th>Nom</th>
            <th>Qté</th>
            <th>Valeur</th>
            <th>Gain</th>
            <th></th>
          </tr>
        </thead>

        <tbody id="tableBody"></tbody>

      </table>

    </div>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

  const SUPABASE_URL =
    "https://rsctqdpmfzisfksfrplp.supabase.co";

  const SUPABASE_ANON_KEY =
    "sb_publishable_JVsEDtbtNRF1RJzVBLcs6g_x4EqL49r";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

  const authBox = document.getElementById("authBox");
  const app = document.getElementById("app");
  const statusEl = document.getElementById("status");
  const logoutBtn = document.getElementById("logoutBtn");
  const tableBody = document.getElementById("tableBody");

  let currentUser = null;
  let holdings = [];

  function euro(v) {
    return new Intl.NumberFormat(
      "fr-FR",
      {
        style: "currency",
        currency: "EUR"
      }
    ).format(v);
  }

  async function signup() {

    const email =
      document.getElementById("email").value;

    const password =
      document.getElementById("password").value;

    const { error } =
      await supabaseClient.auth.signUp({
        email,
        password
      });

    if (error) {
      statusEl.textContent = error.message;
      return;
    }

    statusEl.textContent =
      "Compte créé avec succès";
  }

  async function login() {

    const email =
      document.getElementById("email").value;

    const password =
      document.getElementById("password").value;

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

    if (error) {
      statusEl.textContent = error.message;
      return;
    }

    currentUser = data.user;

    showApp();

    loadHoldings();
  }

  async function logout() {

    await supabaseClient.auth.signOut();

    currentUser = null;

    authBox.classList.remove("hidden");
    app.classList.add("hidden");
    logoutBtn.classList.add("hidden");
  }

  function showApp() {

    authBox.classList.add("hidden");
    app.classList.remove("hidden");
    logoutBtn.classList.remove("hidden");
  }

  async function loadHoldings() {

    const { data, error } =
      await supabaseClient
      .from("holdings")
      .select("*")
      .order("created_at", {
        ascending: false
      });

    if (error) {
      console.error(error);
      return;
    }

    holdings = data || [];

    render();
  }

  function render() {

    tableBody.innerHTML = "";

    let totalValue = 0;
    let invested = 0;

    holdings.forEach(stock => {

      const value =
        stock.quantity * stock.current_price;

      const cost =
        stock.quantity * stock.buy_price;

      const gain =
        value - cost;

      totalValue += value;
      invested += cost;

      const tr =
        document.createElement("tr");

      tr.innerHTML = `
        <td>${stock.symbol}</td>
        <td>${stock.name}</td>
        <td>${stock.quantity}</td>
        <td>${euro(value)}</td>
        <td class="${
          gain >= 0
          ? "positive"
          : "negative"
        }">
          ${euro(gain)}
        </td>
        <td>
          <button
            class="btn btn-danger"
            onclick="deleteStock(${stock.id})"
          >
            Supprimer
          </button>
        </td>
      `;

      tableBody.appendChild(tr);
    });

    const totalGain =
      totalValue - invested;

    const perf =
      invested > 0
      ? (totalGain / invested) * 100
      : 0;

    document.getElementById("totalValue")
      .textContent = euro(totalValue);

    document.getElementById("totalGain")
      .textContent = euro(totalGain);

    document.getElementById("totalPerf")
      .textContent = perf.toFixed(2) + "%";

    document.getElementById("stockCount")
      .textContent = holdings.length;
  }

  async function addStock() {

    const symbol =
      document.getElementById("symbol")
      .value
      .toUpperCase();

    const name =
      document.getElementById("name").value;

    const quantity =
      Number(
        document.getElementById("quantity").value
      );

    const buyPrice =
      Number(
        document.getElementById("buyPrice").value
      );

    const currentPrice =
      Number(
        document.getElementById("currentPrice").value
      );

    const { error } =
      await supabaseClient
      .from("holdings")
      .insert({
        user_id: currentUser.id,
        symbol,
        name,
        quantity,
        buy_price: buyPrice,
        current_price: currentPrice
      });

    if (error) {
      console.error(error);
      alert(error.message);
      return;
    }

    loadHoldings();
  }

  async function deleteStock(id) {

    const { error } =
      await supabaseClient
      .from("holdings")
      .delete()
      .eq("id", id);

    if (error) {
      console.error(error);
      return;
    }

    loadHoldings();
  }

  document
    .getElementById("signupBtn")
    .addEventListener("click", signup);

  document
    .getElementById("loginBtn")
    .addEventListener("click", login);

  document
    .getElementById("logoutBtn")
    .addEventListener("click", logout);

  document
    .getElementById("addBtn")
    .addEventListener("click", addStock);

</script>

</body>
</html>
